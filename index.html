<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Trainingsplan</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--ok:#16a34a;--danger:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#151b2e;--text:#e5e7eb;--muted:#94a3b8;--line:#263048;--accent:#3b82f6;--ok:#22c55e;--danger:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 0;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0}h2{margin:0 0 6px;font-size:18px}
.row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}
nav{display:flex;gap:4px}
.tab{flex:1;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);padding:10px 4px;font-size:15px;font-weight:600;cursor:pointer}
.tab.on{color:var(--accent);border-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
select,input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
select{flex:1}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.ic{width:38px;height:38px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;cursor:pointer;font-size:16px;flex:none}
.ic.danger{color:var(--danger)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:14px}
.bar>div{height:100%;background:var(--ok);transition:width .2s}
.exname{font-weight:700;font-size:17px}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.set{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.set.on{background:var(--ok);border-color:var(--ok);color:#fff}
.fields{display:flex;gap:10px}
.fields label,.exrow label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px;flex:1}
.fields input,.exrow input{width:100%}
.exrow{border-top:1px solid var(--line);padding:10px 0}
.exrow .name{width:100%;margin-bottom:8px;font-weight:600}
.exrow .nums{display:flex;gap:8px;align-items:flex-end}
.title{font-weight:700;font-size:17px}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.sticky .btn{max-width:732px;margin:0 auto;display:block}
.chart{width:100%;height:auto;margin:8px 0}
.chart text{fill:var(--muted);font-size:12px}
.hist-item{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
ul.plain{margin:6px 0 0;padding-left:18px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="row"><h1 class="grow">🏋️ Trainingsplan</h1><span id="status" class="muted small"></span></div>
  <div class="row"><select id="userSel" aria-label="Person"></select><button class="ic" data-a="newUser" title="Person hinzufügen">＋</button></div>
  <nav>
    <button class="tab" data-a="tab" data-tab="train">Training</button>
    <button class="tab" data-a="tab" data-tab="plan">Plan</button>
    <button class="tab" data-a="tab" data-tab="hist">Verlauf</button>
  </nav>
</header>
<main id="app"></main>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const rid = () => Math.random().toString(36).slice(2, 9);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v) => parseFloat(String(v).replace(',', '.')) || 0;
const fmtDate = (iso, long) => new Date(iso).toLocaleDateString('de-DE', long ? { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' } : { day: '2-digit', month: '2-digit' });

let users = [], uid = null, S = null, tab = 'train', curDay = null, histEx = null, timer = null, pending = false;

async function api(path, opts = {}) {
  const r = await fetch('/api' + path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function status(t) { $('#status').textContent = t; }
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1800); }

async function doSave() {
  try { await api('/users/' + uid, { method: 'PUT', body: JSON.stringify(S) }); pending = false; status('Gespeichert ✓'); }
  catch { status('Fehler beim Speichern ⚠'); }
}
function save() { pending = true; status('Speichert…'); clearTimeout(timer); timer = setTimeout(doSave, 500); }
async function flush() { if (pending) { clearTimeout(timer); await doSave(); } }

function ensure() {
  S.days = S.days || []; S.history = S.history || []; S.sessions = S.sessions || {};
}
async function loadUser(id) {
  await flush();
  uid = id; localStorage.setItem('uid', id); S = null; render();
  S = await api('/users/' + id); ensure();
  curDay = null; histEx = null; render();
}
async function init() {
  users = await api('/users');
  if (users.length) {
    const saved = localStorage.getItem('uid');
    await loadUser(users.find((u) => u.id === saved) ? saved : users[0].id);
  } else render();
}

const findDay = (id) => S.days.find((d) => d.id === id);
const findEx = (dayId, exId) => findDay(dayId).exercises.find((e) => e.id === exId);
const sess = (day) => (S.sessions[day.id] ||= { sets: {}, weight: {}, reps: {} });
const padSets = (arr, n) => { arr = arr || []; while (arr.length < n) arr.push(false); return arr.slice(0, n); };
const move = (arr, i, dir) => { const j = i + dir; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
function lastOf(name) {
  for (let i = S.history.length - 1; i >= 0; i--) {
    const it = S.history[i].items.find((x) => x.name.toLowerCase() === name.toLowerCase());
    if (it) return { ...it, date: S.history[i].date };
  }
  return null;
}

function viewTrain() {
  if (!S.days.length) return '<div class="card muted">Noch keine Trainingstage. Lege im Tab „Plan“ einen an.</div>';
  if (!findDay(curDay)) curDay = S.days[0].id;
  const day = findDay(curDay), ss = sess(day);
  let total = 0, done = 0;
  const cards = day.exercises.map((ex) => {
    const arr = (ss.sets[ex.id] = padSets(ss.sets[ex.id], ex.sets));
    total += arr.length; done += arr.filter(Boolean).length;
    const last = lastOf(ex.name);
    const w = ss.weight[ex.id] ?? ex.weight, r = ss.reps[ex.id] ?? ex.reps;
    return `<div class="card">
      <div class="exname">${esc(ex.name)}</div>
      <div class="muted small">Ziel: ${ex.sets} × ${esc(ex.reps)}${last ? ` · Zuletzt: ${last.weight} kg × ${esc(last.reps)} (${fmtDate(last.date)})` : ''}</div>
      <div class="sets">${arr.map((on, i) => `<button class="set ${on ? 'on' : ''}" data-a="set" data-ex="${ex.id}" data-i="${i}" aria-label="Satz ${i + 1}">${i + 1}</button>`).join('')}</div>
      <div class="fields">
        <label>Gewicht (kg)<input type="number" inputmode="decimal" step="0.5" data-f="sw" data-ex="${ex.id}" value="${esc(w)}"></label>
        <label>Wiederholungen<input type="text" inputmode="numeric" data-f="sr" data-ex="${ex.id}" value="${esc(r)}"></label>
      </div>
      ${ex.note ? `<div class="muted small" style="margin-top:8px">📝 ${esc(ex.note)}</div>` : ''}
    </div>`;
  }).join('');
  return `<div class="chips">${S.days.map((d) => `<button class="chip ${d.id === curDay ? 'on' : ''}" data-a="day" data-day="${d.id}">${esc(d.name)}</button>`).join('')}</div>
    <div class="bar"><div style="width:${total ? Math.round(done / total * 100) : 0}%"></div></div>
    ${cards || '<div class="card muted">Dieser Tag hat noch keine Übungen.</div>'}
    <div class="sticky"><button class="btn primary block" data-a="finish">Training abschließen (${done}/${total} Sätze)</button></div>`;
}

function viewPlan() {
  const days = S.days.map((d) => `<div class="card">
    <div class="row">
      <input class="grow title" data-f="dayName" data-day="${d.id}" value="${esc(d.name)}" aria-label="Name des Trainingstags">
      <button class="ic" data-a="moveDay" data-day="${d.id}" data-dir="-1" title="Nach oben">↑</button>
      <button class="ic" data-a="moveDay" data-day="${d.id}" data-dir="1" title="Nach unten">↓</button>
      <button class="ic danger" data-a="delDay" data-day="${d.id}" title="Tag löschen">🗑</button>
    </div>
    ${d.exercises.map((x) => `<div class="exrow">
      <input class="name" data-f="ex.name" data-day="${d.id}" data-ex="${x.id}" value="${esc(x.name)}" aria-label="Übung">
      <div class="nums">
        <label>Sätze<input type="number" inputmode="numeric" min="1" max="10" data-f="ex.sets" data-day="${d.id}" data-ex="${x.id}" value="${x.sets}"></label>
        <label>Wdh.<input type="text" data-f="ex.reps" data-day="${d.id}" data-ex="${x.id}" value="${esc(x.reps)}"></label>
        <label>kg<input type="number" inputmode="decimal" step="0.5" data-f="ex.weight" data-day="${d.id}" data-ex="${x.id}" value="${x.weight}"></label>
        <button class="ic" data-a="moveEx" data-day="${d.id}" data-ex="${x.id}" data-dir="-1">↑</button>
        <button class="ic" data-a="moveEx" data-day="${d.id}" data-ex="${x.id}" data-dir="1">↓</button>
        <button class="ic danger" data-a="delEx" data-day="${d.id}" data-ex="${x.id}">✕</button>
      </div>
      <input class="name" style="margin:8px 0 0;font-weight:400" placeholder="Notiz (optional)" data-f="ex.note" data-day="${d.id}" data-ex="${x.id}" value="${esc(x.note)}">
    </div>`).join('')}
    <button class="btn block" style="margin-top:10px" data-a="addEx" data-day="${d.id}">＋ Übung</button>
  </div>`).join('');
  return days + `<button class="btn block" data-a="addDay">＋ Trainingstag</button>
    <div class="card" style="margin-top:14px">
      <h2>Profil</h2>
      <div class="row"><input class="grow" data-f="userName" value="${esc(S.name)}" aria-label="Name"></div>
      <div class="row"><button class="btn grow" data-a="export">Daten exportieren</button><button class="btn danger grow" data-a="delUser">Person löschen</button></div>
    </div>`;
}

function chart(name) {
  const pts = S.history.flatMap((h) => h.items.filter((i) => i.name === name).map((i) => ({ t: new Date(h.date).getTime(), w: i.weight }))).sort((a, b) => a.t - b.t);
  if (pts.length < 2) return '<p class="muted">Für ein Diagramm sind mindestens zwei Einträge nötig.</p>';
  const W = 600, H = 200, P = 36;
  let min = Math.min(...pts.map((p) => p.w)), max = Math.max(...pts.map((p) => p.w));
  if (min === max) { min -= 1; max += 1; }
  const x = (i) => P + (W - 2 * P) * i / (pts.length - 1);
  const y = (w) => H - P - (H - 2 * P) * (w - min) / (max - min);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Gewichtsverlauf ${esc(name)}">
    <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="var(--line)"/>
    <polyline points="${pts.map((p, i) => `${x(i)},${y(p.w)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.w)}" r="4" fill="var(--accent)"/>`).join('')}
    <text x="2" y="${y(max) + 4}">${max} kg</text><text x="2" y="${y(min) + 4}">${min} kg</text>
    <text x="${P}" y="${H - 8}">${fmtDate(pts[0].t)}</text><text x="${W - P}" y="${H - 8}" text-anchor="end">${fmtDate(pts[pts.length - 1].t)}</text></svg>`;
}

function viewHist() {
  const names = [...new Set(S.history.flatMap((h) => h.items.map((i) => i.name)))].sort((a, b) => a.localeCompare(b, 'de'));
  if (!names.length) return '<div class="card muted">Noch keine abgeschlossenen Trainings. Schließe im Tab „Training“ eine Einheit ab, dann erscheint hier dein Verlauf.</div>';
  if (!names.includes(histEx)) histEx = names[0];
  const list = [...S.history].reverse().map((h) => `<div class="card"><div class="hist-item"><div>
      <b>${esc(h.day)}</b> <span class="muted small">${fmtDate(h.date, true)}</span>
      <ul class="plain">${h.items.map((i) => `<li>${esc(i.name)}: ${i.weight} kg · ${i.sets}×${esc(i.reps)}</li>`).join('')}</ul></div>
      <button class="ic danger" data-a="delSession" data-id="${h.id}" title="Eintrag löschen">🗑</button></div></div>`).join('');
  return `<div class="card"><h2>Gewichtsverlauf</h2>
    <select data-f="histEx" style="width:100%">${names.map((n) => `<option ${n === histEx ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
    ${chart(histEx)}</div><h2 style="margin:16px 0 8px">Einheiten</h2>${list}`;
}

function render() {
  const app = $('#app');
  $('#userSel').innerHTML = users.map((u) => `<option value="${esc(u.id)}" ${u.id === uid ? 'selected' : ''}>${esc(u.name)}</option>`).join('');
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.tab === tab));
  if (!users.length) { app.innerHTML = '<div class="card"><h2>Willkommen 👋</h2><p class="muted">Lege die erste Person an, um loszulegen.</p><button class="btn primary" data-a="newUser">Person anlegen</button></div>'; return; }
  if (!S) { app.innerHTML = '<p class="muted">Lade…</p>'; return; }
  app.innerHTML = tab === 'train' ? viewTrain() : tab === 'plan' ? viewPlan() : viewHist();
}

async function newUser() {
  const name = (prompt('Name der neuen Person:') || '').trim();
  if (!name) return;
  const u = await api('/users', { method: 'POST', body: JSON.stringify({ name }) });
  users = await api('/users');
  await loadUser(u.id);
}

function finish() {
  const day = findDay(curDay), ss = sess(day), items = [];
  day.exercises.forEach((ex) => {
    const n = (ss.sets[ex.id] || []).filter(Boolean).length;
    if (!n) return;
    const w = num(ss.weight[ex.id] ?? ex.weight), r = String(ss.reps[ex.id] ?? ex.reps);
    items.push({ name: ex.name, weight: w, reps: r, sets: n, planned: ex.sets });
    ex.weight = w; // Plan-Gewicht für das nächste Mal übernehmen
  });
  if (!items.length) { toast('Noch keine Sätze abgehakt'); return; }
  S.history.push({ id: rid(), date: new Date().toISOString(), day: day.name, items });
  delete S.sessions[day.id];
  save(); render(); toast('Training gespeichert 💪');
}

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, d = el.dataset;
  try {
    if (a === 'tab') { tab = d.tab; render(); return; }
    if (a === 'day') { curDay = d.day; render(); return; }
    if (a === 'newUser') return newUser();
    if (a === 'finish') return finish();
    if (a === 'set') { const ss = sess(findDay(curDay)); ss.sets[d.ex][+d.i] = !ss.sets[d.ex][+d.i]; }
    else if (a === 'addDay') S.days.push({ id: rid(), name: 'Neuer Tag', exercises: [] });
    else if (a === 'delDay') { if (!confirm('Diesen Trainingstag samt Übungen löschen?')) return; S.days = S.days.filter((x) => x.id !== d.day); delete S.sessions[d.day]; }
    else if (a === 'moveDay') move(S.days, S.days.findIndex((x) => x.id === d.day), +d.dir);
    else if (a === 'addEx') findDay(d.day).exercises.push({ id: rid(), name: 'Neue Übung', sets: 3, reps: '10', weight: 0, note: '' });
    else if (a === 'delEx') { const day = findDay(d.day); day.exercises = day.exercises.filter((x) => x.id !== d.ex); }
    else if (a === 'moveEx') { const day = findDay(d.day); move(day.exercises, day.exercises.findIndex((x) => x.id === d.ex), +d.dir); }
    else if (a === 'delSession') { if (!confirm('Diesen Eintrag löschen?')) return; S.history = S.history.filter((h) => h.id !== d.id); }
    else if (a === 'delUser') {
      if (!confirm(`„${S.name}“ und alle Daten endgültig löschen?`)) return;
      pending = false; clearTimeout(timer);
      await api('/users/' + uid, { method: 'DELETE' });
      users = await api('/users'); S = null; uid = null;
      if (users.length) await loadUser(users[0].id); else render();
      return;
    }
    else if (a === 'export') {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = `trainingsplan-${uid}.json`; l.click();
      return;
    }
    save(); render();
  } catch (err) { toast('Fehler: ' + err.message); }
});

document.addEventListener('input', (e) => {
  const el = e.target, f = el.dataset.f, d = el.dataset, v = el.value;
  if (!f || f === 'userName' || f === 'histEx') return;
  if (f === 'dayName') findDay(d.day).name = v;
  else if (f.startsWith('ex.')) {
    const k = f.slice(3), ex = findEx(d.day, d.ex);
    ex[k] = k === 'sets' ? Math.max(1, Math.min(10, parseInt(v) || 1)) : k === 'weight' ? num(v) : v;
  }
  else if (f === 'sw') sess(findDay(curDay)).weight[d.ex] = v;
  else if (f === 'sr') sess(findDay(curDay)).reps[d.ex] = v;
  save();
});

document.addEventListener('change', async (e) => {
  const el = e.target, f = el.dataset.f;
  if (el.id === 'userSel') { await loadUser(el.value); return; }
  if (f === 'histEx') { histEx = el.value; render(); }
  if (f === 'userName') {
    const name = el.value.trim(); if (!name) { el.value = S.name; return; }
    S.name = name; const u = users.find((x) => x.id === uid); if (u) u.name = name;
    save(); render();
  }
});

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !uid || pending || document.activeElement?.dataset?.f) return;
  try { S = await api('/users/' + uid); ensure(); render(); } catch {}
});

init().catch(() => { $('#app').innerHTML = '<div class="card">Server nicht erreichbar.</div>'; });
</script>
</body>
</html>
