# Trainingsplan – Docker Compose für Unraid (Compose Manager)
#
# Einrichtung (einmalig, im Unraid-Terminal):
#   cd /mnt/user/appdata
#   git clone https://github.com/unionrave/trainingsplan.git
# Damit liegen die App-Dateien unter /mnt/user/appdata/trainingsplan/app
# und die Daten (Pläne, PINs) unter /mnt/user/appdata/trainingsplan/data.
#
# Danach diesen Stack im Compose Manager einfügen, TRAINER_PIN ändern und starten.
# Erreichbar unter http://<UNRAID-IP>:8085
#
# Update:  cd /mnt/user/appdata/trainingsplan && git pull
#          danach den Container neu starten.

services:
  trainingsplan:
    image: node:20-alpine
    container_name: trainingsplan
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      - TZ=Europe/Berlin
      - PORT=3000
      - DATA_DIR=/data
      - TRAINER_PIN=123456    # BITTE ÄNDERN: Zugang des Trainers zu allen Plänen
    ports:
      - "8085:3000"           # Host-Port links bei Bedarf ändern
    volumes:
      - /mnt/user/appdata/trainingsplan/app:/app:ro
      - /mnt/user/appdata/trainingsplan/data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
