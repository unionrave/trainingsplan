# Trainingsplan – Docker Compose für Unraid (Compose Manager)
#
# Vorbereitung:
#   1. Ordner anlegen:  /mnt/user/appdata/trainingsplan/app
#   2. Dort server.js, index.html und library.json ablegen
#   3. TRAINER_PIN unten ändern
#   4. Stack mit dieser Datei starten, danach erreichbar unter http://<UNRAID-IP>:8085
#
# Die Daten (eine JSON-Datei pro Person) liegen unter
# /mnt/user/appdata/trainingsplan/data und bleiben bei Updates erhalten.

services:
  trainingsplan:
    image: node:20-alpine
    container_name: trainingsplan
    restart: unless-stopped
    user: "99:100"            # Unraid-Standard: nobody:users
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      - TZ=Europe/Berlin
      - PORT=3000
      - DATA_DIR=/data
      - TRAINER_PIN=123456    # BITTE ÄNDERN: Zugang des Trainers zu allen Plänen
    ports:
      - "8085:3000"           # Host-Port links bei Bedarf ändern
    volumes:
      - /mnt/user/appdata/trainingsplan/app:/app:ro
      - /mnt/user/appdata/trainingsplan/data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
